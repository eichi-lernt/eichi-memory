<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Eichi Memory – Zahlenzwillinge</title>

  <!-- Lesefreundliche, kostenfreie Schriften -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      /* Eichi-Style Farbpalette */
      --orange:#E66A3D;
      --yellow:#F2C94C;
      --green-d:#3F5F25;
      --green-m:#5F7F3A;
      --beige:#F6E2C6;
      --white:#ffffff;

      --sidebar-w: 260px;
      --radius: 18px;

      --card-w: 130px;
      --card-h: 170px;

      --shadow: 0 10px 28px rgba(0,0,0,.12);
      --shadow-soft: 0 6px 18px rgba(0,0,0,.10);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Andika, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, rgba(95,127,58,.10), rgba(246,226,198,.55));
      color:#1f2a1a;
      min-height:100vh;
    }

    .app{
      display:grid;
      grid-template-columns: 1fr var(--sidebar-w);
      gap: 22px;
      padding: 22px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Spielbereich */
    .board{
      background: rgba(246,226,198,.72);
      border: 3px solid rgba(63,95,37,.55);
      border-radius: calc(var(--radius) + 8px);
      box-shadow: var(--shadow);
      padding: 18px;
      position: relative;
      overflow:hidden;
      min-height: 520px;
    }

    .boardHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 10px;
    }

    .title{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .badge{
      width:42px;height:42px;
      border-radius: 14px;
      background: rgba(230,106,61,.18);
      border: 2px solid rgba(63,95,37,.55);
      display:grid;place-items:center;
      font-weight:800;
      color: var(--green-d);
    }
    .subtitle{
      font-size: 14px;
      opacity:.85;
    }

    .grid{
      display:grid;
      gap: 14px;
      place-content:center;
      padding: 12px 0 6px;
      min-height: 430px;
    }

    /* Sidebar */
    aside{
      background: rgba(255,255,255,.75);
      border-radius: calc(var(--radius) + 10px);
      border: 3px solid rgba(63,95,37,.45);
      box-shadow: var(--shadow-soft);
      padding: 16px;
    }

    .panelTitle{
      font-weight:800;
      font-size: 18px;
      margin: 2px 0 14px;
      color: var(--green-d);
    }

    .section{
      margin: 14px 0 18px;
      padding: 12px;
      border-radius: var(--radius);
      border: 2px solid rgba(63,95,37,.25);
      background: rgba(246,226,198,.45);
    }
    .section h3{
      margin: 0 0 10px;
      font-size: 14px;
      letter-spacing:.2px;
      color: rgba(63,95,37,.95);
    }

    .btnRow{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    button{
      font-family: inherit;
      border: 2px solid rgba(63,95,37,.50);
      background: rgba(255,255,255,.90);
      border-radius: 16px;
      padding: 10px;
      cursor:pointer;
      transition: transform .08s ease, background .12s ease;
      user-select:none;
    }
    button:active{ transform: scale(.98); }
    button[aria-pressed="true"]{
      background: rgba(242,201,76,.55);
      border-color: rgba(63,95,37,.75);
    }

    .startBtn{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 14px 12px;
      font-size: 18px;
      font-weight: 800;
      background: rgba(230,106,61,.20);
      border-color: rgba(63,95,37,.75);
    }

    /* F1: Kartenanzahl – Iconbuttons */
    .layoutIcon{
      width: 62px;
      height: 46px;
      display:grid;
      gap: 4px;
      padding: 6px;
      border-radius: 12px;
      background: rgba(246,226,198,.45);
      border: 2px solid rgba(63,95,37,.25);
    }
    .miniCard{
      background: rgba(63,95,37,.20);
      border: 2px solid rgba(63,95,37,.35);
      border-radius: 6px;
    }

    /* F2: Zahlenraum – 10er-Reihen Miniatur */
    .rangeIcon{
      width: 132px;
      height: 46px;
      padding: 8px;
      border-radius: 12px;
      background: rgba(246,226,198,.45);
      border: 2px solid rgba(63,95,37,.25);
      display:grid;
      gap:6px;
    }
    .tenRow{
      display:grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
    }
    .cell{
      height: 10px;
      border-radius: 3px;
      background: rgba(63,95,37,.16);
      border: 1px solid rgba(63,95,37,.20);
    }
    .cell.on{
      background: rgba(230,106,61,.35);
      border-color: rgba(63,95,37,.35);
    }

    /* Karten */
    .card{
      width: var(--card-w);
      height: var(--card-h);
      perspective: 900px;
      cursor:pointer;
    }
    .card[aria-disabled="true"]{
      cursor: default;
      opacity: .98;
    }

    .cardInner{
      width:100%;height:100%;
      position:relative;
      transform-style:preserve-3d;
      transition: transform .45s ease;
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--shadow-soft);
      background: transparent;
    }
    .card.flipped .cardInner{ transform: rotateY(180deg); }

    .face{
      position:absolute; inset:0;
      backface-visibility:hidden;
      border-radius: calc(var(--radius) + 4px);
      display:grid;
      place-items:center;
      overflow:hidden;

      /* ✅ Ordnerstruktur: Bild liegt in /bilder */
      border: 10px solid rgba(63,95,37,.8);
      border-image: url("bilder/acorn-border.png") 40 round;
      background: rgba(255,255,255,.92);
    }

    .back{
      background:
        radial-gradient(circle at 20% 20%, rgba(242,201,76,.28), transparent 52%),
        radial-gradient(circle at 80% 15%, rgba(230,106,61,.18), transparent 50%),
        rgba(246,226,198,.85);
    }
    .back .eichi{
      width: 72%;
      height: 72%;
      /* ✅ Ordnerstruktur: Bild liegt in /bilder */
      background: url("bilder/eichi.png") center/contain no-repeat;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.10));
    }

    .front{
      transform: rotateY(180deg);
      background: rgba(255,255,255,.96);
    }

    .number{
      font-size: 68px;
      font-weight: 800;
      color: rgba(63,95,37,.95);
      line-height: 1;
      letter-spacing: 0.5px;
    }
    .number.altA{ font-family: Andika, Arial, sans-serif; }
    .number.altB{ font-family: "Atkinson Hyperlegible", Andika, Arial, sans-serif; }

    /* Overlay: Geschafft */
    .overlay{
      position:absolute; inset:0;
      display:none;
      background: rgba(63,95,37,.45);
      place-items:center;
      padding: 18px;
    }
    .overlay.show{ display:grid; }

    .winCard{
      width:min(520px, 92%);
      background: rgba(255,255,255,.94);
      border-radius: calc(var(--radius) + 10px);
      border: 4px solid rgba(242,201,76,.65);
      box-shadow: var(--shadow);
      padding: 18px 18px 14px;
      text-align:center;
    }
    .winTitle{
      font-size: 28px;
      font-weight: 900;
      color: var(--green-d);
      margin: 8px 0 6px;
    }
    .winText{
      margin: 0 0 14px;
      opacity: .9;
    }
    .winIcon{
      width: 110px;
      height: 110px;
      margin: 0 auto;
    }

    /* Spielmodus: Sidebar ausblenden */
    body.playMode .app{
      grid-template-columns: 1fr;
      max-width: 100%;
    }
    body.playMode aside{ display:none; }
    body.playMode .board{ min-height: calc(100vh - 44px); }

    @media (max-width: 920px){
      .app{ grid-template-columns: 1fr; }
      aside{ order:-1; }
    }
  </style>
</head>

<body>
  <div class="app">
    <main class="board" aria-label="Memory Spielfeld">
      <div class="boardHeader">
        <div class="title">
          <div class="badge">E</div>
          <div>
            <div style="font-weight:900;font-size:18px;color:var(--green-d);">Zahlenzwillinge</div>
            <div class="subtitle">Finde die gleichen Zahlen – jedes Paar sieht absichtlich etwas anders aus.</div>
          </div>
        </div>
        <div id="status" class="subtitle" aria-live="polite"></div>
      </div>

      <div id="grid" class="grid" role="grid" aria-label="Karten"></div>

      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-label="Geschafft">
        <div class="winCard">
          <svg class="winIcon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="60" cy="60" r="54" fill="rgba(242,201,76,.65)" stroke="rgba(63,95,37,.75)" stroke-width="4"/>
            <path d="M35 70c8 18 42 18 50 0" fill="none" stroke="rgba(63,95,37,.85)" stroke-width="6" stroke-linecap="round"/>
            <circle cx="45" cy="50" r="6" fill="rgba(63,95,37,.85)"/>
            <circle cx="75" cy="50" r="6" fill="rgba(63,95,37,.85)"/>
            <path d="M60 22c10 10 10 20 0 30c-10-10-10-20 0-30Z" fill="rgba(230,106,61,.75)" stroke="rgba(63,95,37,.60)" stroke-width="3"/>
          </svg>
          <div class="winTitle">Geschafft!</div>
          <p class="winText">Alle Karten sind aufgedeckt. Super gemacht!</p>
          <button class="startBtn" id="playAgain">Nochmal spielen</button>
        </div>
      </div>
    </main>

    <aside aria-label="Einstellungen">
      <div class="panelTitle">Start</div>

      <div class="section">
        <h3>F1: Wie viele Karten?</h3>
        <div class="btnRow" id="countButtons"></div>
      </div>

      <div class="section">
        <h3>F2: Welcher Zahlenraum?</h3>
        <div class="btnRow" id="rangeButtons"></div>
      </div>

      <button class="startBtn" id="startBtn">F3: Start</button>

      <p style="margin:12px 4px 0; font-size:12px; opacity:.75;">
        Bilder liegen in <b>bilder/</b> → <b>bilder/eichi.png</b> und <b>bilder/acorn-border.png</b>.
      </p>
    </aside>
  </div>

  <script>
    const CONFIG = {
      counts: [6, 8, 10, 12],
      ranges: [10, 20],
      mismatchDelayMs: 2000,
      layouts: {
        6:  { cols: 3, rows: 2 },
        8:  { cols: 4, rows: 2 },
        10: { cols: 5, rows: 2 },
        12: { cols: 4, rows: 3 }
      },
      prefer11to20: 0.80
    };

    let selectedCount = 8;
    let selectedRange = 10;

    let deck = [];
    let firstPick = null;
    let secondPick = null;
    let lock = false;
    let matches = 0;

    const gridEl = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const overlayEl = document.getElementById('overlay');

    const countButtonsEl = document.getElementById('countButtons');
    const rangeButtonsEl = document.getElementById('rangeButtons');

    function buildCountButtons(){
      countButtonsEl.innerHTML = '';
      CONFIG.counts.forEach(n => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(n === selectedCount));
        btn.title = `${n} Karten`;
        btn.appendChild(makeLayoutIcon(n));
        btn.addEventListener('click', () => {
          selectedCount = n;
          updatePressedStates(countButtonsEl, btn);
        });
        countButtonsEl.appendChild(btn);
      });
    }

    function makeLayoutIcon(n){
      const { cols, rows } = CONFIG.layouts[n];
      const icon = document.createElement('div');
      icon.className = 'layoutIcon';
      icon.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      icon.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      for(let i=0;i<n;i++){
        const c = document.createElement('div');
        c.className = 'miniCard';
        icon.appendChild(c);
      }
      return icon;
    }

    function buildRangeButtons(){
      rangeButtonsEl.innerHTML = '';
      CONFIG.ranges.forEach(r => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(r === selectedRange));
        btn.title = `Zahlenraum bis ${r}`;
        btn.appendChild(makeRangeIcon(r));
        btn.addEventListener('click', () => {
          selectedRange = r;
          updatePressedStates(rangeButtonsEl, btn);
        });
        rangeButtonsEl.appendChild(btn);
      });
    }

    function makeRangeIcon(r){
      const wrap = document.createElement('div');
      wrap.className = 'rangeIcon';

      const row1 = document.createElement('div');
      row1.className = 'tenRow';
      const row2 = document.createElement('div');
      row2.className = 'tenRow';

      for(let i=0;i<10;i++){
        const c1 = document.createElement('div');
        c1.className = 'cell on';
        row1.appendChild(c1);

        const c2 = document.createElement('div');
        c2.className = 'cell ' + (r >= 20 ? 'on' : '');
        row2.appendChild(c2);
      }
      if(r === 10){
        [...row2.children].forEach(c => c.classList.remove('on'));
      }

      wrap.appendChild(row1);
      wrap.appendChild(row2);
      return wrap;
    }

    function updatePressedStates(container, activeBtn){
      [...container.querySelectorAll('button')].forEach(b => b.setAttribute('aria-pressed', 'false'));
      activeBtn.setAttribute('aria-pressed', 'true');
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('playAgain').addEventListener('click', () => {
      overlayEl.classList.remove('show');
      startGame();
    });

    async function enterPlayMode(){
      document.body.classList.add('playMode');
      try{
        if(document.documentElement.requestFullscreen){
          await document.documentElement.requestFullscreen();
        }
      }catch(e){}
    }

    async function exitPlayMode(){
      document.body.classList.remove('playMode');
      try{
        if(document.fullscreenElement && document.exitFullscreen){
          await document.exitFullscreen();
        }
      }catch(e){}
    }

    function startGame(){
      overlayEl.classList.remove('show');
      firstPick = null;
      secondPick = null;
      lock = false;
      matches = 0;

      deck = buildDeck(selectedCount, selectedRange);
      renderDeck(deck);
      setStatus(`Paare: ${selectedCount/2} • Zahlenraum: bis ${selectedRange}`);

      enterPlayMode();
    }

    function buildDeck(cardCount, rangeMax){
      const pairCount = cardCount / 2;
      const range = (a,b) => Array.from({length: b-a+1}, (_,i)=> a+i);

      let chosen = [];

      if(rangeMax === 10){
        const pool = range(1,10);
        shuffle(pool);
        chosen = pool.slice(0, pairCount);
      } else {
        const primary = range(11,20);
        const secondary = range(1,10);

        shuffle(primary);
        shuffle(secondary);

        const needPrimary = Math.min(primary.length, Math.round(pairCount * CONFIG.prefer11to20));
        const needSecondary = pairCount - needPrimary;

        chosen = [
          ...primary.slice(0, needPrimary),
          ...secondary.slice(0, needSecondary)
        ];

        if(chosen.length < pairCount){
          const remainingPrimary = primary.slice(needPrimary);
          const remainingSecondary = secondary.slice(needSecondary);
          chosen = chosen.concat(remainingPrimary, remainingSecondary).slice(0, pairCount);
        } else if(chosen.length > pairCount){
          chosen = chosen.slice(0, pairCount);
        }

        shuffle(chosen);
      }

      const cards = [];
      chosen.forEach((val, idx) => {
        cards.push({ id: `${val}-a-${idx}`, value: val, variantFont: 'A', matched:false });
        cards.push({ id: `${val}-b-${idx}`, value: val, variantFont: 'B', matched:false });
      });

      shuffle(cards);
      return cards;
    }

    function renderDeck(cards){
      gridEl.innerHTML = '';
      const { cols } = CONFIG.layouts[selectedCount];
      gridEl.style.gridTemplateColumns = `repeat(${cols}, var(--card-w))`;

      cards.forEach(card => {
        const el = document.createElement('div');
        el.className = 'card';
        el.setAttribute('role','gridcell');
        el.dataset.id = card.id;
        el.dataset.value = card.value;
        el.dataset.variant = card.variantFont;
        el.setAttribute('aria-disabled','false');
        el.setAttribute('aria-label','Karte');

        el.innerHTML = `
          <div class="cardInner">
            <div class="face back">
              <div class="eichi" aria-hidden="true"></div>
            </div>
            <div class="face front">
              <div class="number ${card.variantFont==='A'?'altA':'altB'}">${card.value}</div>
            </div>
          </div>
        `;

        el.addEventListener('click', () => onCardClick(el));
        gridEl.appendChild(el);
      });
    }

    function onCardClick(cardEl){
      if(lock) return;
      if(cardEl.classList.contains('flipped')) return;
      if(cardEl.getAttribute('aria-disabled') === 'true') return;

      flipCard(cardEl, true);
      speakNumber(cardEl.dataset.value);

      if(!firstPick){
        firstPick = cardEl;
        return;
      }

      secondPick = cardEl;
      lock = true;

      const v1 = firstPick.dataset.value;
      const v2 = secondPick.dataset.value;

      if(v1 === v2){
        markMatched(firstPick);
        markMatched(secondPick);
        matches += 1;
        resetPicks(false);

        if(matches === selectedCount/2){
          onWin();
        }else{
          lock = false;
        }
      }else{
        setTimeout(() => {
          flipCard(firstPick, false);
          flipCard(secondPick, false);
          resetPicks(true);
          lock = false;
        }, CONFIG.mismatchDelayMs);
      }
    }

    function markMatched(cardEl){
      cardEl.setAttribute('aria-disabled','true');
      cardEl.style.opacity = '1';
    }

    function resetPicks(clearStatus){
      firstPick = null;
      secondPick = null;
      setStatus(`${clearStatus ? 'Weiter!' : 'Treffer!'} Paare gefunden: ${matches} / ${selectedCount/2}`);
    }

    function flipCard(cardEl, on){
      cardEl.classList.toggle('flipped', on);
    }

    async function onWin(){
      setStatus('Alle Paare gefunden!');
      overlayEl.classList.add('show');
      await exitPlayMode();
    }

    function setStatus(text){
      statusEl.textContent = text;
    }

    function speakNumber(n){
      const num = String(n);
      if(!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();

      const u = new SpeechSynthesisUtterance(num);
      const voices = window.speechSynthesis.getVoices?.() || [];
      const de = voices.find(v => (v.lang||'').toLowerCase().startsWith('de-ch'))
              || voices.find(v => (v.lang||'').toLowerCase().startsWith('de'));
      if(de) u.voice = de;

      u.rate = 0.95;
      u.pitch = 1.0;
      u.volume = 1.0;

      window.speechSynthesis.speak(u);
    }

    if('speechSynthesis' in window){
      window.speechSynthesis.onvoiceschanged = () => {};
    }

    function shuffle(arr){
      for(let i=arr.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    buildCountButtons();
    buildRangeButtons();

    deck = buildDeck(selectedCount, selectedRange);
    renderDeck(deck);
    setStatus(`Wähle rechts Einstellungen und drücke Start.`);
  </script>
</body>
</html>
